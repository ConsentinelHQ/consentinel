name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs. A cancelled main run leaves failed checks on
  # that commit, and Vercel then refuses to promote its deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  # Fast gate: lint, typecheck, unit tests, build for web + shared.
  check:
    name: Lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Data layer tests run against a real Postgres, not a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/consentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      # Type-aware lint resolves @consentinel/* through their compiled .d.ts files.
      # On a clean checkout those do not exist yet, and every import reads as `any`.
      - name: Build workspace packages for lint
        run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm lint
      # A generated migration that drifts from schema.ts is a silent prod failure.
      - name: Check migrations are in sync with schema
        run: |
          pnpm --filter @consentinel/db exec drizzle-kit generate
          git diff --exit-code packages/db/migrations || {
            echo "::error::schema.ts changed without a generated migration. Run: pnpm --filter @consentinel/db db:generate";
            exit 1;
          }
      - run: pnpm typecheck --filter=!@consentinel/scanner
      - run: pnpm test --filter=!@consentinel/scanner
      - run: pnpm build --filter=!@consentinel/scanner

  # Website-only PRs don't touch the scanner, so its browser job is skipped.
  # A skipped required check counts as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scanner: ${{ steps.filter.outputs.scanner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "scanner=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          if echo "$files" | grep -qvE '^apps/web/|^docs/|\.md$|^$'; then
            echo "scanner=true" >> "$GITHUB_OUTPUT"
          else
            echo "scanner=false" >> "$GITHUB_OUTPUT"
          fi

  # Scanner has a Chromium dependency; isolated so a browser cache miss never slows the fast gate.
  scanner:
    name: Scanner (Playwright)
    needs: changes
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The worker test drives a job through a real queue into a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/consentinel_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @consentinel/scanner exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @consentinel/scanner exec playwright install --with-deps chromium
      # Usually ~12s. If Ubuntu's package mirror stalls, fail fast and re-run
      # rather than hold the PR for the job's full 25 minutes.
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        timeout-minutes: 4
        run: pnpm --filter @consentinel/scanner exec playwright install-deps chromium
      - run: pnpm typecheck --filter=@consentinel/scanner
      - run: pnpm test --filter=@consentinel/scanner
      - run: pnpm build --filter=@consentinel/scanner
      - name: Docker build (no push)
        run: docker build -f apps/scanner/Dockerfile -t consentinel-scanner:ci .

  # We sell security. Fail on known-vulnerable deps.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The npm audit endpoint times out now and then. A real advisory fails
      # every attempt, so retrying only filters out network flakes.
      - name: pnpm audit --audit-level=high
        run: |
          for i in 1 2 3; do
            pnpm audit --audit-level=high && exit 0
            echo "audit attempt $i failed, retrying in 20s"; sleep 20
          done
          exit 1
