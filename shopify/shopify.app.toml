# Consentinel Shopify app config. Deploy with the Shopify CLI from this folder:
#   shopify app deploy
# The app itself is served by apps/web (/shopify and /api/shopify/*).

client_id = "eef62e847d2c0e5abccb7b2e5f89915e"
name = "Consentinel"
handle = "consentinel-opt-out-checker"
application_url = "https://www.getconsentinel.com/shopify"
embedded = true

[access_scopes]
# Read-only. read_themes finds where each ad tag is hardcoded in the live theme;
# read_privacy_settings checks Shopify's cookie banner and "Do not sell" page.
scopes = "read_themes,read_privacy_settings"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://www.getconsentinel.com/shopify"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "app_subscriptions/update"]
  uri = "https://www.getconsentinel.com/api/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://www.getconsentinel.com/api/shopify/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
